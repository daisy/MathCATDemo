AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MathCAT Demo TTS proxy (Polly, Google, Azure)

Parameters:
  AllowedOrigins:
    Type: String
    Default: 'https://daisy.github.io,http://localhost:8080,http://127.0.0.1:8080'
    Description: Comma-separated browser origins allowed to call this API
  TtsProvider:
    Type: String
    Default: polly
    AllowedValues:
      - polly
      - google
      - azure
    Description: Active speech engine for the proxy
  AzureSpeechKey:
    Type: String
    Default: ''
    NoEcho: true
  AzureSpeechRegion:
    Type: String
    Default: ''
  GoogleTtsApiKey:
    Type: String
    Default: ''
    NoEcho: true
  DailyCharLimit:
    Type: Number
    Default: 125000
    MinValue: 0
    Description: Most characters to synthesize per UTC day (0 turns speech off)

Globals:
  HttpApi:
    # Slows abuse by limiting total traffic per route (not per caller).
    # DailyCharLimit is what caps the TTS bill.
    DefaultRouteSettings:
      ThrottlingRateLimit: 2
      ThrottlingBurstLimit: 10

Resources:
  TtsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          TTS_PROVIDER: !Ref TtsProvider
          AZURE_SPEECH_KEY: !Ref AzureSpeechKey
          AZURE_SPEECH_REGION: !Ref AzureSpeechRegion
          GOOGLE_TTS_API_KEY: !Ref GoogleTtsApiKey
          DAILY_CHAR_LIMIT: !Ref DailyCharLimit
          USAGE_TABLE: !Ref UsageTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UsageTable.Arn
      Events:
        TtsPost:
          Type: HttpApi
          Properties:
            Path: /tts
            Method: POST
        TtsOptions:
          Type: HttpApi
          Properties:
            Path: /tts
            Method: OPTIONS

  UsageTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

Outputs:
  TtsApiUrl:
    Description: POST endpoint for the MathCAT demo frontend
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/tts'
