name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, ueb-parser]

  # Rebuild the main demo daily if the current MathCAT main has passed CI.
  schedule:
    - cron: '17 4 * * *' # run in early morning

  # Fired by daisy/MathCAT after a successful braille-parser build.
  repository_dispatch:
    types: [braille-parser-updated]

permissions:
  contents: write

concurrency:
  # Serialize deploys so main (site root) and input/ deploys don't race on gh-pages.
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ueb-parser pushes and MathCAT braille-parser updates both publish under /input/.
      IS_INPUT_DEMO: ${{ github.ref_name == 'ueb-parser' || github.event_name == 'repository_dispatch' }}
      SHOULD_DEPLOY: 'true'

    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          # repository_dispatch always uses the workflow from the default branch;
          # still check out ueb-parser so the input demo sources are used.
          ref: ${{ github.event_name == 'repository_dispatch' && 'ueb-parser' || github.ref }}
          path: MathCATDemo

      - name: Checkout MathCAT
        uses: actions/checkout@v4
        with:
          repository: daisy/MathCAT
          # Input demo builds against braille-parser; main site uses MathCAT main.
          ref: ${{ (github.ref_name == 'ueb-parser' || github.event_name == 'repository_dispatch') && 'braille-parser' || 'main' }}
          path: MathCAT

      - name: Check that MathCAT main passed CI
        if: github.event_name == 'schedule'
        working-directory: MathCAT
        run: |
          # MathCAT's CI moves the "latest" tag to a main commit only after CI succeeds.
          git fetch --force origin refs/tags/latest:refs/tags/latest

          MAIN_SHA="$(git rev-parse HEAD)"
          LATEST_SHA="$(git rev-list -n 1 refs/tags/latest)"

          if [ "$MAIN_SHA" != "$LATEST_SHA" ]; then
            echo "Current MathCAT main has not passed CI; skipping deployment."
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Install Rust toolchain
        if: env.SHOULD_DEPLOY == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        if: env.SHOULD_DEPLOY == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: MathCATDemo

      - name: Install Trunk
        if: env.SHOULD_DEPLOY == 'true'
        run: cargo install trunk --locked

      - name: Build site
        if: env.SHOULD_DEPLOY == 'true'
        working-directory: MathCATDemo
        run: |
          if [ "$IS_INPUT_DEMO" = "true" ]; then
            trunk build --public-url /MathCATDemo/input/
          else
            trunk build --public-url /MathCATDemo/
          fi

      - name: Deploy to gh-pages (input/)
        if: env.SHOULD_DEPLOY == 'true' && env.IS_INPUT_DEMO == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: MathCATDemo/dist
          destination_dir: input

      - name: Deploy to gh-pages (site root)
        if: env.SHOULD_DEPLOY == 'true' && env.IS_INPUT_DEMO != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: MathCATDemo/dist
          # Preserve /input from the input-demo deploy.
          keep_files: true
