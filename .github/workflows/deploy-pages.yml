name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Where to publish the build
        required: true
        type: choice
        options:
          - input
          - root
        default: input
  push:
    branches: [main, ueb-parser]
  # Fired by daisy/MathCAT after a successful braille-parser build (see MathCAT rust.yml).
  repository_dispatch:
    types: [braille-parser-updated]

permissions:
  contents: write

concurrency:
  # Serialize deploys so main (site root) and input/ deploys don't race on gh-pages.
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # input/: ueb-parser pushes, MathCAT braille-parser dispatch, or manual "input" run.
      IS_INPUT_DEMO: ${{ github.ref_name == 'ueb-parser' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'input') }}
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          # For input deploys, use ueb-parser sources even if the workflow file came from main.
          ref: ${{ env.IS_INPUT_DEMO == 'true' && 'ueb-parser' || github.ref }}
          path: MathCATDemo

      - name: Checkout MathCAT
        uses: actions/checkout@v4
        with:
          repository: daisy/MathCAT
          # Input demo builds against braille-parser; main site uses MathCAT main.
          ref: ${{ env.IS_INPUT_DEMO == 'true' && 'braille-parser' || 'main' }}
          path: MathCAT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MathCATDemo

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build site
        working-directory: MathCATDemo
        run: |
          if [ "$IS_INPUT_DEMO" = "true" ]; then
            trunk build --public-url /MathCATDemo/input/
          else
            trunk build --public-url /MathCATDemo/
          fi

      - name: Deploy to gh-pages (input/)
        if: env.IS_INPUT_DEMO == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: MathCATDemo/dist
          destination_dir: input

      - name: Deploy to gh-pages (site root)
        if: env.IS_INPUT_DEMO != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: MathCATDemo/dist
          # Preserve /input from the input-demo deploy.
          keep_files: true
