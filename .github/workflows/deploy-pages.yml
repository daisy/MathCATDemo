name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, ueb-parser]

permissions:
  contents: write

concurrency:
  # Serialize deploys so main (site root) and ueb-parser (input/) don't race on gh-pages.
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IS_INPUT_DEMO: ${{ github.ref_name == 'ueb-parser' }}
    steps:
      - name: Checkout demo
        uses: actions/checkout@v4
        with:
          path: MathCATDemo

      - name: Checkout MathCAT
        uses: actions/checkout@v4
        with:
          repository: daisy/MathCAT
          # ueb-parser demo builds against braille-parser; main uses MathCAT main.
          ref: ${{ github.ref_name == 'ueb-parser' && 'braille-parser' || 'main' }}
          path: MathCAT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: MathCATDemo

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build site
        working-directory: MathCATDemo
        run: |
          if [ "$IS_INPUT_DEMO" = "true" ]; then
            trunk build --public-url /MathCATDemo/input/
          else
            trunk build --public-url /MathCATDemo/
          fi

      - name: Deploy to gh-pages (input/)
        if: env.IS_INPUT_DEMO == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: MathCATDemo/dist
          destination_dir: input

      - name: Deploy to gh-pages (site root)
        if: env.IS_INPUT_DEMO != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: MathCATDemo/dist
          # Preserve /input from the ueb-parser deploy.
          keep_files: true
